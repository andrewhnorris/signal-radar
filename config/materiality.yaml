# How a claim becomes a signal, and how a signal becomes an interruption.
#
# Core design tension: the brief says the team MISSES signals (a recall problem)
# and also says not every mention is worth interrupting an analyst (a precision
# problem). These pull in opposite directions, so the pipeline splits them:
#
#   Stage 1 (extract) - run LIBERALLY. Capture anything that plausibly touches
#                       a holding. Cheap to over-capture; everything is browsable.
#   Stage 2 (alert)   - run CONSERVATIVELY. Only high-score signals surface at
#                       the top of the digest. Nothing is deleted, only ranked.
#
# Tune alert_threshold to move along that curve. Do not tune the extractor.

# The four claim types we score. Chosen because each maps to one of the three
# materiality axes in the brief (competitive position / clinical program /
# commercial trajectory), plus timeline risk which cuts across all three.
signal_types:
  clinical_readout:
    weight: 1.0
    description: "Trial result, endpoint, event accrual, enrollment, safety finding."
  timeline_change:
    weight: 0.9
    description: "Readout, filing, or launch date moved, hedged, or newly vague."
  competitive_positioning:
    weight: 0.85
    description: "Explicit claim about a rival's profile, share, or prospects."
  commercial_trajectory:
    weight: 0.7
    description: "Sales, patient adds, pricing, access, guidance, market size."

# Where in the call the claim appeared. Prepared remarks are lawyered and
# rehearsed; Q&A is where hedging and unscripted competitive commentary live.
# This multiplier is small but it consistently reorders the top of the digest.
section_multipliers:
  qa: 1.25
  prepared: 1.0

# How directly the claim touches the portfolio.
linkage_multipliers:
  named_asset: 1.3        # names a holding's drug or trial by name
  shared_indication: 1.15 # same disease/segment, no name
  shared_mechanism: 1.15  # same target class - catches unknown-unknowns
  none: 0.0               # drop

# Novelty. A talking point repeated verbatim from last quarter is not news.
# This is the single highest-leverage multiplier in the file.
novelty_multipliers:
  new: 1.4          # not present in prior quarter
  changed: 1.3      # present but materially reworded (numbers, dates, hedging)
  repeated: 0.5     # boilerplate
  unknown: 1.0      # no prior quarter cached

# Holding tier from portfolio.yaml.
tier_multipliers:
  1: 1.2
  2: 1.0

# Score bands. Base score is the LLM's 0-1 materiality judgement, then
# multiplied through. Threshold chosen from eval/labeled_set.csv - see README.
alert_threshold: 1.10   # above this: surfaces in "Needs an analyst" section
watch_threshold: 0.55   # above this: surfaces in "Context" section
                        # below watch: retained in JSON, not rendered

# Hard caps so one loud call cannot flood the digest.
max_alerts_per_call: 5
max_alerts_per_digest: 12
