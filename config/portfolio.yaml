# Competitor universe: whose calls we ingest. A company earns a slot by sharing
# an INDICATION or a MECHANISM with a holding - not by being a "peer" in the
# abstract. Novo is here because it owns two MASH mechanisms, not because it is
# a large pharma.
competitor_universe:
  - {ticker: NVO,  name: Novo Nordisk,        why: "semaglutide in MASH; acquired Akero (FGF21/efruxifermin) Oct 2025"}
  - {ticker: LLY,  name: Eli Lilly,           why: "tirzepatide/retatrutide in MASH and obesity"}
  - {ticker: ETNB, name: 89bio,               why: "pegozafermin, FGF21 in MASH"}
  - {ticker: VKTX, name: Viking Therapeutics, why: "VK2809, THR-beta - same mechanism as Rezdiffra"}
  - {ticker: ARWR, name: Arrowhead,           why: "PNPLA3 siRNA; MDGL licensor and potential competitor"}
  - {ticker: UTHR, name: United Therapeutics, why: "PAH - overlaps INSM TPIP"}
  - {ticker: DXCM, name: Dexcom,              why: "CGM - overlaps PODD closed loop"}
  - {ticker: BMRN, name: BioMarin,            why: "PKU - overlaps PTCT sepiapterin"}
